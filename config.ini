[MARKET_CONDITIONS]
# Market condition analysis parameters to filter low-quality trades
# Enable/disable market condition filtering
enable_market_filter = True

# Liquidity analysis: minimum percentile for acceptable liquidity (0-100)
min_liquidity_percentile = 30

# Volatility analysis: minimum percentile for acceptable volatility (0-100)
min_atr_percentile = 25

# Movement frequency: minimum percentage of candles with significant movement (0-1)
min_movement_frequency = 0.3

# Minimum candle range in pips (for EUR/USD, 0.0001 = 1 pip)
min_range_pips = 0.0002

# Rolling window sizes for calculations
window_liquidity = 20
window_volatility = 20
window_movement = 10

