[TRADING_PARAMETERS]
# Default instrument and timeframe
# Available periods: m1, m5, m15, m30, H1, H2, H3, H4, H6, H8, D1, W1, M1
timeframe = m1

# Position sizing and risk management
lots = 2
stop = 10
limit = 30

# Pegged order settings
peggedstop = Y
peggedlimit = Y
pegstoptype = M
peglimittype = M

# Date format and time settings
date_format = %m.%d.%Y %H:%M:%S
days = 4

[INSTRUMENTS]
# List of instruments to trade (comma-separated)
